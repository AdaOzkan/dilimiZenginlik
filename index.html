<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Divanü Lügati’t-Türk Kelime Haritası</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;display:flex;height:100vh}
#side{width:320px;overflow:auto;padding:12px;background:#f7f3ea;border-right:1px solid #ccc}
#map{flex:1}
h1{font-size:17px;margin:0 0 6px}
input{width:100%;padding:8px;margin:8px 0;border:1px solid #bbb;border-radius:6px}
.w{padding:6px 8px;border-bottom:1px solid #ddd;cursor:pointer;font-size:14px}
.w:hover{background:#efe6cf}
.w b{color:#7a2e0e}
small{color:#555}
.pop b{color:#7a2e0e}
.pop div{margin:4px 0}
@media(max-width:700px){body{flex-direction:column-reverse}#side{width:100%;height:40%}}
</style>
</head>
<body>
<div id="side">
<h1>Divanü Lügati’t-Türk (1072–77)</h1>
<small>Kaşgarlı Mahmud’un bahsettiği Türk boylarının yaklaşık yurtları. Noktaya tıklayın ya da kelime arayın.</small>
<input id="q" placeholder="Kelime ara (ör. tağ, su, yıl)…">
<div id="detail"></div>
<div id="list"></div>
<small>Not: Konumlar eserdeki boy bilgilerine dayalı yaklaşık yerlerdir; kelime-boy eşleşmeleri örnek amaçlıdır, akademik kaynakla doğrulayın.</small>
</div>
<div id="map"></div>

<script>
const regions = [
  {n:"Kaşgar (Karluk / Hakaniye)", c:[39.47, 75.99], d:"Kaşgarlı’nın yaşadığı, Karahanlı başkenti çevresi",
   w:[["tağ","dağ","dağ"],["ata","baba","ata"],["su","su","su"],["yol","yol","yol"],["kız","genç kadın, kız","kız"]]},
  {n:"Oğuz (Seyhun aşağı havzası)", c:[44.8, 65.5], d:"Oğuzların Cend–Yenikent çevresindeki yurdu",
   w:[["yıl","yıl","yıl"],["göz","göz","göz"],["ekin","ekili tahıl","ekin"],["arslan","aslan","arslan"],["kuş","kuş","kuş"]]},
  {n:"Kıpçak (İtil – Yayık bozkırları)", c:[49.5, 52.0], d:"Kıpçakların Kuzey bozkırlardaki yurdu",
   w:[["at","at","at"],["ot","ateş / ot","ot"],["tuz","tuz","tuz"],["yaz","ilkbahar–yaz mevsimi","yaz"],["kış","kış","kış"]]},
  {n:"Yağma / Çigil (Isık Göl çevresi)", c:[42.4, 77.2], d:"Yağma ve Çigil boylarının bölgesi",
   w:[["bal","bal","bal"],["ay","ay","ay"],["gün","güneş, gün","gün"],["el","il, ülke","il / el"],["oğul","oğul","oğul"]]},
  {n:"Argu (Talas – Fergana)", c:[42.5, 72.2], d:"Argu boyunun yaşadığı Talas–Fergana çevresi",
   w:[["yürek","kalp","yürek"],["ana","anne","ana"],["süt","süt","süt"],["kol","kol","kol"],["taş","taş","taş"]]},
  {n:"Uygur (Turfan – Beşbalık)", c:[42.95, 89.18], d:"Uygurların Turfan çevresindeki yurdu",
   w:[["tuğ","bayrak, sancak","tuğ"],["bitig","yazı, kitap","bitik (eski)"],["kut","talih, mutluluk","kut"],["öz","kendi, öz","öz"],["ev","ev","ev"]]},
  {n:"Kırgız (Yenisey)", c:[53.7, 91.4], d:"Kırgızların Yenisey havzasındaki yurdu",
   w:[["ög","akıl","—"],["böri","kurt","börü (eski)"],["kümüş","gümüş","gümüş"],["yağız","esmer, kara","yağız"],["kök","gök, mavi","gök"]]},
  {n:"Bulgar – Suvar (İtil)", c:[54.9, 49.1], d:"Orta İtil Bulgar ve Suvar yurtları",
   w:[["yer","yer, toprak","yer"],["kün","gün","gün"],["saç","saç","saç"],["ög","anne (Bulgar çevresinde)","—"],["balık","balık","balık"]]},
  {n:"Beçenek (Karadeniz kuzeyi)", c:[47.5, 34.0], d:"Beçeneklerin Karadeniz kuzey bozkırları",
   w:[["ayak","ayak","ayak"],["ev","ev","ev"],["ata","baba","ata"],["bıçak","bıçak","bıçak"],["koyun","koyun","koyun"]]},
  {n:"Tuhsi (Tanrı Dağları)", c:[43.5, 81.0], d:"Tuhsi boyunun Tanrı Dağları çevresi",
   w:[["tengri","gök, tanrı","tanrı"],["yıldız","yıldız","yıldız"],["yel","rüzgâr","yel"],["yağmur","yağmur","yağmur"],["kar","kar","kar"]]}
];

const map = L.map('map').setView([44, 65], 4);

// file:/// protokolüyle uyumlu alternatif ücretsiz açık katman
L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
  maxZoom: 20,
  attribution: '© OpenStreetMap France | OpenStreetMap contributors'
}).addTo(map);

const markers = [];
regions.forEach(function(r, i) {
  const h = '<div class="pop"><b>' + r.n + '</b><div><small>' + r.d + '</small></div>' +
    r.w.map(function(x) { return '<div><b>' + x[0] + '</b> — ' + x[1] + ' <small>(bugün: ' + x[2] + ')</small></div>'; }).join('') + '</div>';
  
  const marker = L.circleMarker(r.c, {
    radius: 11,
    color: '#7a2e0e',
    weight: 3,
    fillColor: '#e8a33d',
    fillOpacity: .95
  }).addTo(map).bindPopup(h, {maxWidth: 300});
  
  marker.bindTooltip(r.n, {direction: 'top'});
  marker.on('click', function() { showPanel(i); });
  markers[i] = marker;
});

function showPanel(i) {
  const r = regions[i];
  document.getElementById('detail').innerHTML = '<div style="background:#fff;border:2px solid #7a2e0e;border-radius:8px;padding:8px;margin-bottom:8px"><b>' + r.n + '</b><br><small>' + r.d + '</small>' + r.w.map(function(x) { return '<div><b>' + x[0] + '</b> — ' + x[1] + ' <small>(bugün: ' + x[2] + ')</small></div>'; }).join('') + '</div>';
}

const list = document.getElementById('list');
const q = document.getElementById('q');

function draw() {
  const t = q.value.trim().toLowerCase();
  let out = '';
  regions.forEach(function(r, i) {
    r.w.forEach(function(x) {
      if (!t || x.join(' ').toLowerCase().indexOf(t) > -1) {
        out += '<div class="w" data-i="' + i + '"><b>' + x[0] + '</b> — ' + x[1] + '<br><small>' + r.n + '</small></div>';
      }
    });
  });
  list.innerHTML = out || '<small>Sonuç yok.</small>';
}

list.onclick = function(e) {
  const el = e.target.closest('.w');
  if (!el) return;
  const i = +el.dataset.i;
  map.setView(regions[i].c, 6);
  markers[i].openPopup();
  showPanel(i);
};

q.oninput = draw;
draw();
</script>
</body>
</html>
